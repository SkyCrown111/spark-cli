<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SparkCLI Editor</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header>
    <h1>SparkCLI Editor</h1>
    <p class="sub">Level zones &amp; anim states — synced with CLI staging</p>
  </header>
  <main>
    <section id="staging-panel">
      <h2>Staging</h2>
      <p id="summary" class="sub">loading…</p>
      <button id="refresh">Refresh</button>
      <ul id="file-list"></ul>
    </section>
    <section id="canvas-panel">
      <h2>Preview</h2>
      <p id="status" class="sub">Waiting for staged files…</p>
      <canvas id="preview" width="640" height="360"></canvas>
      <pre id="detail"></pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>

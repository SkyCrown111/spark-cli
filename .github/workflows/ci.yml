name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:commands

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node dist/cli.js --version
      - name: Phase 1 acceptance
        if: matrix.node-version == 22
        run: node scripts/phase1-accept.mjs
      - name: Phase 1 fixture doctor
        if: matrix.node-version == 22
        run: |
          node dist/cli.js init
          node dist/cli.js model use openai/gpt-4o-mini
          node dist/cli.js doctor --json
        working-directory: fixtures/cocos-3.8-mini
        env:
          OPENAI_API_KEY: sk-ci-placeholder

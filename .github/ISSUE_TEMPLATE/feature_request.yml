name: Feature request
description: Suggest an improvement or new command
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: dropdown
    id: phase
    attributes:
      label: Related ROADMAP phase (if known)
      options:
        - Unknown
        - Phase 1–4
        - Phase 5–7
        - Phase 9–11
